# Portainer: Stacks → Add stack → Repository (este arquivo).
# Antes do Deploy, troque: SEU_DOMINIO, TROQUE_SENHA_DB (2x), TROQUE_SENHA_ROOT, TROQUE_SEGREDO_CRON (2x).
# Traefik: rede "traefik_public" e certificado "letsencrypt". Ajuste se os seus nomes forem outros.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: whatsagent
      DB_USER: whatsagent
      DB_PASSWORD: "TROQUE_SENHA_DB"
      COOKIE_SECURE: "true"
      LOVABLE_CRON_SECRET: "TROQUE_SEGREDO_CRON"
    volumes:
      - app_data:/app/data
    depends_on:
      - mysql
    networks:
      - interna
      - OrionNet
    labels:
      - traefik.enable=true
      - traefik.docker.network=OrionNet
      - traefik.http.routers.whatsagent.rule=Host(`SEU_DOMINIO`)
      - traefik.http.routers.whatsagent.entrypoints=websecure
      - traefik.http.routers.whatsagent.tls=true
      - traefik.http.routers.whatsagent.tls.certresolver=letsencrypt
      - traefik.http.routers.whatsagent.service=whatsagent
      - traefik.http.services.whatsagent.loadbalancer.server.port=3000

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: whatsagent
      MYSQL_USER: whatsagent
      MYSQL_PASSWORD: "TROQUE_SENHA_DB"
      MYSQL_ROOT_PASSWORD: "TROQUE_SENHA_ROOT"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - interna
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Lembrete de inatividade: chama o sistema a cada minuto
  cron:
    image: curlimages/curl:8.12.1
    restart: unless-stopped
    environment:
      LOVABLE_CRON_SECRET: "TROQUE_SEGREDO_CRON"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'while true; do curl --fail --silent --show-error --connect-timeout 10 --max-time 50 -X POST -H "Authorization: Bearer $$LOVABLE_CRON_SECRET" http://app:3000/api/public/jobs/inactivity || echo "Falha na rotina de inatividade" >&2; sleep 60; done'
    depends_on:
      - app
    networks:
      - interna

volumes:
  app_data:
  mysql_data:

networks:
  interna:
  OrionNet:
    external: true
